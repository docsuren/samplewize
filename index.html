<script>
/* Numerical core: same functions, argument order and rounding as the Excel workbooks. */
const X=(()=>{

function lgam(x){if(x<0.5)return Math.log(Math.PI/Math.abs(Math.sin(Math.PI*x)))-lgam(1-x);x-=1;let a=LG[0];const t=x+7.5;for(let i=1;i<9;i++)a+=LG[i]/(x+i);return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);}
function bad(){throw new Error("domain");}
function gammaP(a,x){if(x<=0)return 0;if(x<a+1){let s=1/a,t=s,n=a;for(let i=0;i<100000;i++){n+=1;t*=x/n;s+=t;if(Math.abs(t)<Math.abs(s)*1e-16)break;}return s*Math.exp(-x+a*Math.log(x)-lgam(a));}return 1-gammaQcf(a,x);}
function gammaQcf(a,x){const F=1e-300;let b=x+1-a,c=1/F,d=1/b,h=d;for(let i=1;i<100000;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<F)d=F;c=b+an/c;if(Math.abs(c)<F)c=F;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-16)break;}return Math.exp(-x+a*Math.log(x)-lgam(a))*h;}
function gammaQ(a,x){if(x<=0)return 1;return x<a+1?1-gammaP(a,x):gammaQcf(a,x);}
function betacf(x,a,b){const F=1e-300;const qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<F)d=F;d=1/d;let h=d;for(let m=1;m<200000;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<F)d=F;c=1+aa/c;if(Math.abs(c)<F)c=F;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<F)d=F;c=1+aa/c;if(Math.abs(c)<F)c=F;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-16)break;}return h;}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgam(a+b)-lgam(a)-lgam(b)+a*Math.log(x)+b*Math.log1p(-x));return x<(a+1)/(a+b+2)?bt*betacf(x,a,b)/a:1-bt*betacf(1-x,b,a)/b;}
function ibetainv(p,a,b){if(!(p>0&&p<1&&a>0&&b>0))bad();let lo=0,hi=1,x=a/(a+b);const lb=lgam(a)+lgam(b)-lgam(a+b);for(let i=0;i<400;i++){const f=ibeta(x,a,b)-p;if(f>0)hi=x;else lo=x;const pdf=Math.exp((a-1)*Math.log(x)+(b-1)*Math.log1p(-x)-lb);let nx=x-f/pdf;if(!(nx>lo&&nx<hi)||!isFinite(nx))nx=(lo+hi)/2;if(Math.abs(nx-x)<=1e-15*Math.max(x,1e-300)){x=nx;break;}x=nx;}return x;}
function norminv(p){if(!(p>0&&p<1))bad();const q=p-0.5;let r,v;if(Math.abs(q)<=0.425){r=0.180625-q*q;v=q*(((((((r*2509.0859297630392+33430.575583588128)*r+67265.770927008700)*r+45921.953931549871)*r+13731.693765509461)*r+1971.5909503065514)*r+133.14166789178438)*r+3.387132872796366608)/(((((((r*5226.495278852545+28729.085735721942)*r+39307.895800092710)*r+21213.794301586597)*r+5394.1960214247511)*r+687.18700749205790)*r+42.313330701600911)*r+1);return v;}r=q<0?p:1-p;r=Math.sqrt(-Math.log(r));if(r<=5){r-=1.6;v=(((((((r*7.74545014278341407640e-4+0.0227238449892691845833)*r+0.241780725177450611770)*r+1.27045825245236838258)*r+3.64784832476320460504)*r+5.76949722146069140550)*r+4.63033784615654529590)*r+1.42343711074968357734)/(((((((r*1.05075007164441684324e-9+5.47593808499534494600e-4)*r+0.0151986665636164571966)*r+0.148103976427480074590)*r+0.689767334985100004550)*r+1.67638483018380384940)*r+2.05319162663775882187)*r+1);}else{r-=5;v=(((((((r*2.01033439929228813265e-7+2.71155556874348757815e-5)*r+0.00124266094738807843860)*r+0.0265321895265761230930)*r+0.296560571828504891230)*r+1.78482653667870139450)*r+5.46378491116411436990)*r+6.65790464350110377720)/(((((((r*2.04426310338993978564e-15+1.42151175831644588870e-7)*r+1.84631831751005468180e-5)*r+7.86869131145613259100e-4)*r+0.0148753612908506148525)*r+0.136929880922735805310)*r+0.599832206555887937690)*r+1);}return q<0?-v:v;}
function normcdf(z){const p=gammaP(0.5,z*z/2);return z>=0?0.5+0.5*p:0.5-0.5*p;}
function chiinv(p,df){if(!(p>0&&p<1&&df>0))bad();const a=df/2;let lo=0,hi=Math.max(1,df);while(gammaQ(a,hi/2)>p)hi*=2;let x=(lo+hi)/2;for(let i=0;i<400;i++){const f=gammaQ(a,x/2)-p;if(f>0)lo=x;else hi=x;const pdf=Math.exp((a-1)*Math.log(x/2)-x/2-lgam(a))/2;let nx=x+f/pdf;if(!(nx>lo&&nx<hi)||!isFinite(nx))nx=(lo+hi)/2;if(Math.abs(nx-x)<=1e-14*x){x=nx;break;}x=nx;}return x;}
const need=(...a)=>{for(const v of a)if(typeof v!=="number"||!isFinite(v))bad();};
return {
 eq:(a,b)=>a===b||(typeof a==="string"&&typeof b==="string"&&a.toLowerCase()===b.toLowerCase()),
 iferr:(f,g)=>{try{const r=f();if(typeof r==="number"&&!isFinite(r))return g();return r;}catch(e){return g();}},
 sp:(f,g)=>{let s=0;for(let J=0;J<=300;J++)s+=f(J)*g(J);return s;},
 normsinv:p=>{need(p);return norminv(p);},
 normsdist:z=>{need(z);return normcdf(z);},
 tinv:(p,df)=>{need(p,df);df=Math.trunc(df);if(df<1)bad();const x=ibetainv(p,df/2,0.5);return Math.sqrt(df*(1-x)/x);},
 finv:(p,u,v)=>{need(p,u,v);u=Math.trunc(u);v=Math.trunc(v);if(u<1||v<1)bad();const x=ibetainv(1-p,u/2,v/2);return v/u*x/(1-x);},
 chiinv:(p,df)=>{need(p,df);return chiinv(p,Math.trunc(df));},
 chidist:(x,df)=>{need(x,df);return gammaQ(Math.trunc(df)/2,x/2);},
 poisson:(j,m,c)=>{need(j,m);return Math.exp(j*Math.log(m)-m-lgam(j+1));},
 betadist:(x,a,b)=>{need(x,a,b);return ibeta(x,a,b);},
 betainv:(p,a,b)=>{need(p,a,b);return ibetainv(p,a,b);},
 roundup:(x,d)=>{need(x);const f=Math.pow(10,d),y=x*f;return (y>=0?Math.ceil(y):Math.floor(y))/f;},
 rounddown:(x,d)=>{need(x);const f=Math.pow(10,d);return Math.trunc(x*f)/f;},
 round:(x,d)=>{need(x);const f=Math.pow(10,d),y=Math.abs(x)*f;return Math.sign(x)*Math.round(y)/f;},
 int:x=>{need(x);return Math.floor(x);},abs:x=>{need(x);return Math.abs(x);},
 sqrt:x=>{need(x);if(x<0)bad();return Math.sqrt(x);},ln:x=>{need(x);if(x<=0)bad();return Math.log(x);},exp:x=>{need(x);return Math.exp(x);},
 asin:x=>{need(x);return Math.asin(x);},max:(...a)=>{need(...a);return Math.max(...a);},
};})();
const RU=x=>X.roundup(x-1e-9,0);
const isNum=v=>typeof v==="number"&&isFinite(v);
function inputProblem(kind,val,label){
 const n=isNum(val);
 switch(kind){
  case"prob":return n&&val>0&&val<1?"":label+": enter a value between 0 and 1.";
  case"p0":return n&&val>=0&&val<1?"":label+": enter a value from 0 to below 1.";
  case"pos":return n&&val>0?"":label+": enter a positive value.";
  case"nonneg":return n&&val>=0?"":label+": enter zero or a positive value.";
  case"any":return n?"":label+": enter a number.";
  case"int":return n&&val>=1&&val===Math.floor(val)?"":label+": enter a whole number of at least 1.";
  case"optpos":return val===""||(n&&val>1)?"":label+": leave blank or enter a number above 1.";
  case"optp":return val===""||(n&&val>=0&&val<1)?"":label+": leave blank or enter a proportion.";
  case"ge1":return n&&val>=1?"":label+": enter 1 or more.";
 }return"";
}
const ADJ_ORDER=[["fpc","Finite population correction"],["de","Design effect"],["nc","Non-compliance"],["attr","Non-response, dropout or loss"]];
/* m: method; values: {key:value}; meta: {kind,label} by key; adj: applied adjustment names. */
function compute(m,values,meta,adj){
 const v=Object.assign({},values),work=[];
 for(const st of m.steps){
  if(st.s){
   let lo=st.lo(v),hi=st.hi(v),mid=0,yes=false;
   for(let i=0;i<21;i++){
    if(i>0){if(yes)hi=mid;else lo=mid;}
    mid=Math.floor((lo+hi)/2);
    const e=Object.assign({},v,{n:mid});
    try{yes=!!st.c(e);}catch(err){yes=true;}
   }
   v[st.k]=hi;
   work.push({l:st.l,v:v[st.k],f:"0"});
   continue;
  }
  let r;try{r=st.f(v);if(typeof r==="number"&&!isFinite(r))r=NaN;}catch(err){r=NaN;}
  v[st.k]=r;work.push({l:st.l,v:r,f:st.t||"0.0000"});
 }
 let chk="";
 for(const k of m.keys){const p=inputProblem(meta[k].kind,v[k],meta[k].label);if(p){chk=p;break;}}
 if(!chk)for(const k of adjKeys(adj)){const p=inputProblem(ADJ[k].kind,v[k],ADJ[k].label);if(p){chk=p;break;}}
 if(!chk)for(const[c,msg]of m.checks){let ok=false;try{ok=!!c(v);}catch(e){ok=false;}if(!ok){chk=msg;break;}}
 let warn="";for(const[c,msg]of m.warns){let y=false;try{y=!!c(v);}catch(e){}if(y){warn=msg;break;}}
 const o=m.out,raw=o.raw?v[o.raw]:undefined;let b1="",b2="",mult=1;
 if(chk){b1="Check inputs";}else{try{
  switch(o.kind){
   case"one":b1=RU(raw);break;
   case"even":b1=2*RU(raw/2);break;
   case"two":{const r=o.r?o.r(v):1;b1=RU(raw);b2=RU(r*b1);break;}
   case"total":{const s=o.s?o.s(v):0.5;b1=RU(raw*s);b2=RU(raw*(1-s));break;}
   case"kgroup":{const k=o.k(v);b1=RU(raw/k);mult=k;break;}
   case"cluster":{if(o.m){const mm=o.m(v);b1=RU(raw)*mm;b2=b1;}else{b1=RU(raw);b2=b1;}break;}
   default:b1=raw;
  }
  if(typeof b1==="number"&&!isFinite(b1))b1="Check inputs";
 }catch(e){b1="Check inputs";b2="";}}
 const steps=[];let p1=b1,p2=b2;
 for(const[a,t]of ADJ_ORDER){
  if(!adj.includes(a))continue;
  const f=x=>{
   if(!isNum(x))return x;
   if(a==="fpc"){if(v.adj_N==="")return x;const w=(o.kind==="one"&&isNum(raw))?raw:x;return RU(w/(1+(w-1)/v.adj_N));}
   if(a==="de")return RU(x*v.adj_DE);
   if(a==="nc")return RU(x/Math.pow(1-v.adj_c1-v.adj_c2,2));
   if(a==="attr")return RU(x/(1-v.adj_L));
  };
  p1=f(p1);p2=f(p2);steps.push({t,a:p1,b:p2});
 }
 const total=isNum(p1)?p1*mult+(isNum(p2)?p2:0):p1;
 return {chk,warn,b1,b2,mult,steps,final1:p1,final2:p2,total,work,env:v};
}
function adjKeys(adj){const o=[];for(const a of adj){if(a==="nc")o.push("adj_c1","adj_c2");else if(a==="fpc")o.push("adj_N");else if(a==="de")o.push("adj_DE");else if(a==="attr")o.push("adj_L");}return o;}

function visible(keys,k,v){
 const has=x=>keys.includes(x);
 if(has("modeE")){if(k==="pe")return v.modeE==="Proportion";if(k==="RR"||k==="OR")return v.modeE==="Ratio";}
 if(has("sdmode")){if(k==="sdd")return v.sdmode==="Enter SD of differences";if(k==="sd1"||k==="sd2"||k==="rho")return v.sdmode==="Derive from SDs and correlation";}
 if(has("fmode")){if(k==="f2")return v.fmode==="f squared";if(k==="R2")return v.fmode==="R squared";}
 return true;
}
/* The write-up: same wording and order as the workbooks. labels: {key:text}; nums: citation numbers. */
function writeup(m,r,labels,nums,adj,appNum){
 if(r.chk)return "Correct the inputs to generate a write-up.";
 const keys=m.keys,v=r.env,o=m.out,[g1,g2]=o.g,vk=o.kind==="value"||o.kind==="text";
 const items=keys.filter(k=>visible(keys,k,v)&&!(/^w[567]$/.test(k)&&!(v[k]>0))).map(k=>labels[k].split(" (leave")[0]+" = "+v[k]);
 const gt=(a,b)=>a+" "+g1+(isNum(b)&&g2!==g1?" and "+b+" "+g2:"");
 const two=isNum(r.b2)||r.mult>1;
 let s=(vk?"The calculation used ":"Sample size was calculated using ")+m.title+" ["+nums+"]"+(appNum?", implemented in Samplewize ["+appNum+"]":"")+". Assumptions: "+items.join("; ")+".";
 if(vk)s+=" The result was "+r.b1+" ("+g1+").";
 else s+=" The minimum required sample size was "+gt(r.b1,r.b2)+(two?" ("+(r.b1*r.mult+(isNum(r.b2)?r.b2:0))+" in total)":"")+".";
 const ex=m.extras.map(([l,k])=>{const x=v[k];return l+" = "+(isNum(x)?X.round(x,4):x);});
 if(ex.length)s+=" Derived values: "+ex.join("; ")+".";
 if(!vk&&adj.length){
  let any=false,i=0;
  for(const[a]of ADJ_ORDER){
   if(!adj.includes(a))continue;
   const st=r.steps[i++];let pre="";
   if(a==="fpc"&&v.adj_N!=="")pre=" Applying the finite population correction for a population of "+v.adj_N+" gave ";
   if(a==="de"&&v.adj_DE!==1)pre=" Applying a design effect of "+v.adj_DE+" gave ";
   if(a==="nc"&&v.adj_c1+v.adj_c2>0)pre=" Allowing for non-compliance of "+X.round(v.adj_c1*100,2)+"% in arm 1 and "+X.round(v.adj_c2*100,2)+"% in arm 2 gave ";
   if(a==="attr"&&v.adj_L>0)pre=" Allowing for "+X.round(v.adj_L*100,2)+"% non-response, dropout or loss gave ";
   if(pre){any=true;s+=pre+gt(st.a,st.b)+".";}
  }
  s+=any?" The final sample size target is "+gt(r.final1,r.final2)+(two?" ("+r.total+" in total)":"")+".":" No adjustments were applied, so the final target equals the minimum required.";
 }
 return s+" Planning values were taken from [cite the source of each input].";
}

function activeAdj(v,adj){
 const on={fpc:adj.includes("fpc")&&v.adj_N!=="",de:adj.includes("de")&&v.adj_DE!==1,nc:adj.includes("nc")&&v.adj_c1+v.adj_c2>0,attr:adj.includes("attr")&&v.adj_L>0};
 on.mask=(on.fpc?1:0)+(on.de?2:0)+(on.nc?4:0)+(on.attr?8:0);return on;
}
function composeText(on,n0,N,DE,c1,c2,L){
 const A=on.fpc?n0+" / (1 + ("+n0+" − 1) / "+N+")":n0;
 const num=on.de?(on.fpc?"["+A+"] × "+DE:A+" × "+DE):A;
 const den=[];if(on.nc)den.push("(1 − "+c1+" − "+c2+")²");if(on.attr)den.push("(1 − "+L+")");
 if(!den.length)return num;
 return ((on.fpc||on.de)?"["+num+"]":num)+" / "+(den.length>1?"["+den.join(" × ")+"]":den[0]);
}
/* Continuous value of the composed adjustment, used to check the printed formula. */
function composeValue(on,n0,v){let x=n0;if(on.fpc)x=x/(1+(x-1)/v.adj_N);if(on.de)x*=v.adj_DE;if(on.nc)x/=Math.pow(1-v.adj_c1-v.adj_c2,2);if(on.attr)x/=1-v.adj_L;return x;}
/* Ready-to-copy formula text, including every adjustment in use. */
function formulaText(m,r,labels,adj,plainOf){
 if(r.chk)return {text:"Correct the inputs to generate the formula.",on:{mask:0}};
 const v=r.env,o=m.out,[g1,g2]=o.g,vk=o.kind==="value"||o.kind==="text",L=[];
 m.tex.forEach(([c,t])=>L.push((c?c+": ":"")+plainOf(t)));
 const items=m.keys.filter(k=>visible(m.keys,k,v)&&!(/^w[567]$/.test(k)&&!(v[k]>0))).map(k=>labels[k].split(" (leave")[0]+" = "+v[k]);
 L.push("Where: "+items.join("; ")+".");
 if(vk){L.push("Result: "+r.b1+" ("+g1+").");return {text:L.join("\n"),on:{mask:0}};}
 const raw=o.raw?v[o.raw]:undefined,twoDiff=isNum(r.b2)&&g2!==g1,same=isNum(r.b2)&&g2===g1;
 const baseTxt=r.b1+" "+g1+(twoDiff?" and "+r.b2+" "+g2:"");
 if(o.kind==="one"&&isNum(raw)&&raw!==r.b1)L.push("Base result: n₀ = "+X.round(raw,2)+", rounded up to "+baseTxt+".");
 else L.push("Base result: n₀ = "+baseTxt+".");
 const on=activeAdj(v,adj);
 if(!on.mask){L.push("No adjustments were applied. Final sample size: "+baseTxt+(isNum(r.b2)||r.mult>1?" ("+r.total+" in total)":"")+".");return {text:L.join("\n"),on};}
 const names=[];if(on.fpc)names.push("finite population correction");if(on.de)names.push("design effect");if(on.nc)names.push("non-compliance");if(on.attr)names.push("non-response, dropout or loss");
 L.push("Adjusted formula ("+names.join(", ")+"): n(final) = "+composeText(on,"n₀","N","DE","c₁","c₂","L"));
 const vals=b=>{const w=(on.fpc&&o.kind==="one"&&isNum(raw))?X.round(raw,2):b;return composeText(on,w,v.adj_N,v.adj_DE,v.adj_c1,v.adj_c2,v.adj_L);};
 const chain=(b,pick)=>{let i=0;const out=[b];for(const[a]of ADJ_ORDER){if(!adj.includes(a))continue;const s=r.steps[i++];if(on[a])out.push(s[pick]);}return out.join(" → ");};
 if(twoDiff||(isNum(r.b2)&&r.b1!==r.b2)){
  L.push("With values, "+g1+": n(final) = "+vals(r.b1));L.push("With values, "+g2+": n(final) = "+vals(r.b2));
  L.push("Rounded up after each step, "+g1+": "+chain(r.b1,"a")+".");L.push("Rounded up after each step, "+g2+": "+chain(r.b2,"b")+".");
 }else{
  L.push("With values"+(same?" (each group)":"")+": n(final) = "+vals(r.b1));
  L.push("Rounded up after each step: "+chain(r.b1,"a")+" "+g1+".");
 }
 L.push("Final sample size: "+r.final1+" "+g1+(twoDiff?" and "+r.final2+" "+g2:"")+(isNum(r.b2)||r.mult>1?" ("+r.total+" in total)":"")+".");

}

/* Mistake detector: advisory checks that never change the calculated number. */

  if(is(/sex worker|drug user|people who inject|injecting|homeless|migrant|transgender|men who have sex/))a.pop="hidden";
  else if(is(/records?\b|register|retrospective|chart review|case files?/))a.pop="records";
  else if(is(/hospital|clinic|outpatient|\bopd\b|inpatient|admitted|attending/))a.pop="facility";
  else if(is(/school|college|student|workplace|factory|employees|workers/))a.pop="institution";
  else if(is(/communit|household|village|ward|rural|urban|district|residents|population of/))a.pop="community";

/* Selection tools. Random numbers come from a seeded generator (sfc32), so a list can be reproduced from its seed. */
function sRng(seed){

 const mix=()=>{s=(s+0x9e3779b9)>>>0;let z=s;z=Math.imul(z^(z>>>16),0x85ebca6b);z=Math.imul(z^(z>>>13),0xc2b2ae35);return(z^(z>>>16))>>>0;};

 const next=()=>{const t=(((a+b)>>>0)+d)>>>0;d=(d+1)>>>0;a=b^(b>>>9);b=(c+(c<<3))>>>0;c=((c<<21)|(c>>>11))>>>0;c=(c+t)>>>0;return t>>>0;};
 for(let i=0;i<32;i++)next();
 return{next,u:()=>(next()*2097152+(next()>>>11))/9007199254740992,int:n=>{const lim=Math.floor(4294967296/n)*n;let x;do{x=next();}while(x>=lim);return x%n;}};
}

const S_MAX=100000;
function sCheckCount(N,n){

function sRandomList(N,n,seed){

/* Reads pasted lines such as "Name, 1200" or "Name, 1200, 15". The numbers come last. */
function sParseRows(text,nums){

 String(text||"").split(/\r?\n/).forEach((line,i)=>{const t=line.trim();if(!t)return;const p=t.split(/[,\t;]+/).map(x=>x.trim()).filter(x=>x!=="");

function sRandCheck(o){

 if(new Set(o.arms).size!==o.arms.length)return"Each arm needs a different name.";

 if(o.ratio.length!==o.arms.length||o.ratio.some(x=>!Number.isInteger(x)||x<1||x>50))return"Enter one whole number per arm in the ratio, such as 1:1 or 2:1.";
 if(o.mode==="cluster"){if(o.list.length<o.arms.length)return"Enter at least one cluster per arm.";return"";}
 if(!Number.isInteger(o.n)||o.n<1)return"Enter the number to randomise as a whole number.";
 if(o.n*(o.strata.length||1)>S_MAX)return"This tool can list up to "+S_MAX.toLocaleString("en-IN")+" allocations.";
 if(o.mode==="simple"){if(o.strata.length)return"Stratification needs blocks within each stratum. Choose block randomisation.";return"";}
 if(!o.sizes.length)return"Enter the block size.";

 if(o.sizes.some(x=>!Number.isInteger(x)||x<sum||x%sum!==0))return"Each block size must be a multiple of "+sum+", the total of the ratio.";

 return"";
}
function sRandomise(o){

function sRandCluster(o){

{t:"Sampling error",d:"The difference between a sample estimate and the true population value that arises because only a sample was studied. It falls as the sample grows {r:Levy}."},
{t:"Non-sampling error",d:"Error from sources other than sampling, such as measurement, data entry or non-response. It does not fall simply by increasing the sample {r:Levy}."},
{t:"Selection bias",d:"Systematic error that arises when those studied differ from the intended population in ways that affect the results {r:Delgado,Porta}."},
{t:"Coverage error",aka:"Frame error",d:"Error arising when the sampling frame omits units or includes ineligible ones {r:Levy}."},
{t:"Non-response bias",d:"Bias arising when those who do not take part differ from those who do. A larger sample does not correct it {r:Delgado,Porta}."},
{t:"Generalisability",aka:"External validity",d:"The extent to which results apply beyond the people studied {r:Porta,Hulley}."},
{t:"Source population",aka:"Study base",d:"In a case-control study, the population that gave rise to the cases, and from which controls should be drawn {r:Wacholder}."},
{t:"Overmatching",d:"Matching on a factor that is not a confounder, which can reduce efficiency or introduce bias {r:Schlesselman}."},
{t:"Random allocation",aka:"Randomisation",d:"Assigning participants to study groups by chance. It is separate from random sampling, which selects who enters the study {r:SchulzAlloc}."}
]},
{g:"Randomisation and allocation concealment",a:[
{t:"Allocation sequence",d:"The ordered list that states which arm each successive participant will receive {r:SchulzAlloc}."},
{t:"Simple randomisation",d:"Allocation of each participant by chance, independently of all others {r:AltmanHow,SchulzAlloc}."},
{t:"Block randomisation",aka:"Permuted block randomisation, restricted randomisation",d:"Allocation in blocks that each contain the arms in the intended ratio, in random order, so that group sizes stay balanced {r:AltmanHow,SchulzAlloc}."},
{t:"Block size",d:"The number of participants in a block, which must be a multiple of the total of the allocation ratio. Random variation of block size makes the sequence harder to predict {r:SchulzAlloc,SchulzConc}."},
{t:"Stratified randomisation",d:"Use of a separate blocked sequence within each group defined by a prognostic factor {r:Kernan}."},
{t:"Minimisation",d:"Allocation of each new participant to the arm that would reduce imbalance across chosen factors, often with a random element {r:PocockSimon,AltmanMin}."},
{t:"Cluster randomisation",d:"Allocation of whole groups, such as villages or clinics, to study arms {r:HayesMoulton,Ivers}."},
{t:"Allocation concealment",d:"Keeping the upcoming allocation hidden from those who enrol participants, until the moment of assignment {r:SchulzConc,AltmanConc}."},
{t:"Central allocation",d:"Allocation given by a telephone or web service after a participant has been registered {r:AltmanConc}."},
{t:"Sequentially numbered, opaque, sealed envelopes",aka:"SNOSE",d:"A concealment method in which numbered envelopes, each containing an allocation, are opened in order after enrolment {r:SchulzConc,Doig}."},
{t:"Blinding",aka:"Masking",d:"Keeping participants, carers or assessors unaware of the assigned intervention after allocation. It differs from allocation concealment, which applies before allocation {r:SchulzConc,CONSORT25}."},
{t:"Predictability",aka:"Deciphering",d:"The extent to which a recruiter can work out the next allocation, such as from a known fixed block size in an unblinded trial {r:SchulzConc}."}
]},
{g:"Hypothesis testing and error",a:[
{t:"Null hypothesis",aka:"H₀",d:"The statement being tested, usually that there is no difference or no association between groups {r:Rosner}."},
{t:"Alternative hypothesis",aka:"H₁",d:"The statement accepted when the null hypothesis is rejected, usually that a difference or association exists {r:Rosner}."},
{t:"Type I error",aka:"False positive",d:"Rejecting the null hypothesis when it is true, that is, concluding there is an effect when there is none {r:Rosner,ICHE9}."},
{t:"Significance level",aka:"α, alpha",d:"The maximum accepted probability of a Type I error, set before the study. It is usually 0.05 {r:Rosner,ICHE9}.",f:"α = P(reject H₀ when H₀ is true)",k:["alpha","alpha1","alphaE"]},
{t:"Type II error",aka:"False negative, β, beta",d:"Failing to reject the null hypothesis when a true effect of the assumed size exists. Its probability is written as β {r:Rosner,ICHE9}.",f:"β = P(do not reject H₀ when H₁ is true)"},
{t:"Power",aka:"1 − β",d:"The probability that the study will detect an effect of the assumed size, if that effect is real. Studies usually aim for 80% to 90% {r:Cohen88,ICHE9}.",f:"Power = 1 − β",k:["power","pw2"]},
{t:"p-value",d:"The probability, under a specified statistical model, of a result at least as extreme as the one observed. It does not measure the probability that the hypothesis is true, or the size or importance of an effect {r:ASA}."},
{t:"One-sided and two-sided tests",d:"A two-sided test looks for a difference in either direction and is the usual choice. A one-sided test looks in one direction only, and should be pre-specified and justified {r:ICHE9,Rosner}.",k:["sides"]},
{t:"Z value",aka:"Critical value, standard normal deviate",d:"A point on the standard normal distribution used in formulas. Common values are 1.96 for two-sided α = 0.05, 0.842 for 80% power and 1.282 for 90% power {r:Rosner,Lwanga}.",f:"Z₁₋α/₂ for significance or confidence; Z₁₋β for power"},
{t:"t distribution",aka:"Small-sample t-correction",d:"A distribution with heavier tails than the normal, used when the standard deviation is estimated from the data. It raises the sample size slightly, which matters most in small studies {r:Guenther,Julious04}.",k:["tcorr"]},
{t:"Degrees of freedom",aka:"df",d:"The number of independent pieces of information available to estimate a quantity. In a chi-square test of a table, it equals (rows − 1) × (columns − 1) {r:Rosner}.",k:["df"]},
{t:"Multiplicity",aka:"Multiple comparisons",d:"The increased chance of a false-positive finding when several tests are carried out {r:SchulzMult}."},
{t:"Bonferroni correction",d:"A way to control multiplicity by testing each comparison at the significance level divided by the number of comparisons {r:BlandBonf}.",f:"α for each test = α / k",k:["km","kB"]}
]},
{g:"Measures of frequency and spread",a:[
{t:"Proportion",aka:"p",d:"The number with a characteristic divided by the total number studied, written as a decimal from 0 to 1. For example, 30% is entered as 0.30 {r:Rosner}.",k:["p","p1","p2","p0","pe","pT","pC","Se0","Se1"]},
{t:"Prevalence",d:"The proportion of a population with a condition at a given time {r:Porta}.",k:["Prev","phir"]},
{t:"Incidence",d:"The occurrence of new cases during a period. It may be expressed as a risk or as a rate {r:Porta}."},
{t:"Risk",aka:"Cumulative incidence",d:"The probability that an event occurs during a stated period {r:Porta}."},
{t:"Rate",aka:"λ, incidence rate",d:"The number of events divided by the total person-time at risk {r:Porta,Zhu}.",f:"Rate = events / person-time",k:["l0","l1","tf","y"]},
{t:"Mean",aka:"μ",d:"The sum of the values divided by their number {r:Rosner}.",k:["mu0","mu1"]},
{t:"Variance",aka:"σ²",d:"The average squared distance of the values from their mean {r:Rosner}."},
{t:"Standard deviation",aka:"SD, σ",d:"The square root of the variance. It describes how much individual values vary around the mean {r:AltmanSE}.",k:["sd","sd1","sd2","s0","s1","sdmode"]},
{t:"Standard error",aka:"SE",d:"The standard deviation of an estimate across repeated samples. It describes the uncertainty of the estimate and becomes smaller as the sample grows. Entering an SE in place of an SD gives a sample size that is far too small {r:AltmanSE}.",f:"SE of a mean = SD / √n"},
{t:"Coefficient of variation",aka:"CV",d:"The standard deviation divided by the mean. It expresses variation relative to the mean {r:Lwanga,Rosner}.",f:"CV = σ / μ",k:["cv"]},
{t:"Pooled proportion",aka:"p̄",d:"The average of the group proportions, weighted by group size. It estimates the common proportion expected if the null hypothesis is true {r:Fleiss}."},
{t:"Correlation coefficient",aka:"r, ρ, Pearson, Spearman, Kendall",d:"A measure from −1 to +1 of how closely two variables are related. Pearson's coefficient measures linear relationship. Spearman's and Kendall's use ranks {r:Rosner,BonettWright}.",k:["rc","rw","ctype"]},
{t:"Coefficient of determination",aka:"R²",d:"The proportion of the variation in the outcome that is explained by the predictors in a regression model {r:Cohen88}.",k:["R2","R2c"]}
]},
{g:"Effect measures",a:[
{t:"Effect size",d:"The size of a difference or association. It may be in the original units or standardised. A larger effect needs a smaller sample {r:Cohen88,DELTA2}.",k:["modeE"]},
{t:"Target difference",aka:"Δ, δ",d:"The difference that the study is designed to detect. It should be both important to stakeholders and realistic {r:DELTA2}.",k:["delta","theta","thetaS"]},
{t:"Minimal clinically important difference",aka:"MCID",d:"The smallest change in an outcome that patients perceive as beneficial, and that would lead to a change in management {r:Jaeschke}."},
{t:"Planning value",d:"A value assumed at the design stage, such as an expected proportion or standard deviation. It should come from the literature, routine data or a pilot, and its source should be reported {r:DELTA2,SPIRIT25}."},
{t:"Risk difference",aka:"Absolute risk difference",d:"The risk in one group minus the risk in the other {r:Porta}.",f:"RD = p₁ − p₂"},
{t:"Risk ratio",aka:"RR, relative risk",d:"The risk in the exposed group divided by the risk in the unexposed group. A value of 1 means no difference {r:Porta,Fleiss}.",f:"RR = p₁ / p₀",k:["RR"]},
{t:"Odds",d:"The probability of an event divided by the probability of it not occurring {r:BlandOR}.",f:"Odds = p / (1 − p)"},
{t:"Odds ratio",aka:"OR",d:"The odds in one group divided by the odds in another. A value of 1 means no difference. It is the usual effect measure in case-control studies and logistic regression {r:BlandOR,Schlesselman}.",f:"OR = [p₁ / (1 − p₁)] / [p₀ / (1 − p₀)]",k:["OR","ORsd"]},
{t:"Rate ratio",d:"The event rate in one group divided by the rate in another {r:Porta,Zhu}.",f:"Rate ratio = λ₁ / λ₀"},
{t:"Hazard ratio",aka:"HR",d:"The ratio of the instantaneous event rates in two groups. A value below 1 means that events occur more slowly in the group in the numerator {r:Spruance,Schoenfeld}.",f:"HR = h₁(t) / h₀(t)",k:["HR","HRsd"]},
{t:"Cohen's d",aka:"Standardised effect",d:"The difference between two means divided by the standard deviation. Cohen's reference values are 0.2 (small), 0.5 (medium) and 0.8 (large), and they are not a substitute for a justified target difference {r:Cohen88,DELTA2}.",f:"d = Δ / σ",k:["es","eff"]},
{t:"Cohen's f",d:"The effect size for comparing several means by analysis of variance: the standard deviation of the group means divided by the common standard deviation. Reference values are 0.10, 0.25 and 0.40 {r:Cohen88}.",k:["fA"]},
{t:"Cohen's f²",d:"The effect size for multiple regression. Reference values are 0.02, 0.15 and 0.35 {r:Cohen88}.",f:"f² = R² / (1 − R²)",k:["f2","fmode"]},
{t:"Cohen's w",d:"The effect size for chi-square tests, measuring how far the observed proportions differ from those under the null hypothesis. Reference values are 0.10, 0.30 and 0.50 {r:Cohen88}.",k:["wc"]},
{t:"Probability of superiority",aka:"P(X > Y)",d:"The probability that an observation from one group exceeds an observation from the other. It is the effect measure used for the Mann-Whitney test {r:Noether}.",k:["Pn"]}
]},
{g:"Precision and confidence intervals",a:[
{t:"Precision",d:"How closely an estimate is expected to lie to the true value. Narrower confidence intervals mean greater precision {r:Lwanga,Naing}."},
{t:"Confidence interval",aka:"CI",d:"A range calculated from the sample that, across repeated studies, would contain the true value in the stated percentage of cases {r:Rosner}."},
{t:"Confidence level",d:"The stated long-run percentage of such intervals that would contain the true value, usually 95% {r:Rosner,Lwanga}.",k:["conf"]},
{t:"Absolute precision",aka:"d, margin of error, half-width",d:"The acceptable distance on either side of the estimate, in the units of the estimate. A prevalence of 30% with d = 0.05 gives an interval of about 25% to 35% {r:Lwanga,Naing}.",k:["d","dm","e"]},
{t:"Relative precision",aka:"ε",d:"The half-width of the interval expressed as a fraction of the estimate. A prevalence of 30% with ε = 0.20 gives a half-width of 6 percentage points {r:Lwanga}.",f:"d = ε × p",k:["eps"]},
{t:"Interval width",aka:"Full width, half-width",d:"The full width is the distance from the lower to the upper confidence limit. The half-width is half of that distance {r:BonettWright,BonettICC}.",k:["wf","wI","dA","dk"]},
{t:"Wald interval",d:"The simple interval p ± Z × SE. It performs poorly in small samples and when the proportion is close to 0 or 1 {r:BrownCai,Newcombe}."},
{t:"Wilson score interval",d:"An interval for a proportion that performs better than the Wald interval in small samples and for extreme proportions {r:Wilson,BrownCai}."},
{t:"Clopper-Pearson interval",aka:"Exact interval",d:"An interval based on the binomial distribution, with coverage at least equal to the stated level. It tends to be wider than necessary {r:Clopper,BrownCai}."}
]},
{g:"Adjustments to the sample size",a:[
{t:"Finite population correction",aka:"FPC",d:"A reduction applied when the sample is a substantial fraction of a known, limited population {r:Cochran}.",f:"n = n₀ / [1 + (n₀ − 1) / N]",k:["NopO","Npop","n0","adj_N"]},
{t:"Design effect",aka:"DEFF",d:"The ratio of the variance under the actual design to the variance under simple random sampling. The sample size is multiplied by this value {r:Kish,Donner81}.",f:"DEFF = 1 + (m − 1) × ICC, for equal clusters of size m",k:["adj_DE","nind"]},
{t:"Intracluster correlation",aka:"ICC, ρ",d:"The proportion of total variance that lies between clusters. It shows how alike members of the same cluster are {r:Killip,Donner81}.",f:"ICC = between-cluster variance / total variance",k:["icc"]},
{t:"Cluster size",aka:"m",d:"The number of participants studied in each cluster {r:Donner81}.",k:["mS","m","mc"]},
{t:"Coefficient of variation of cluster size",d:"The standard deviation of cluster sizes divided by the mean cluster size. Unequal clusters increase the design effect {r:Eldridge}.",f:"DEFF = 1 + [(CV² + 1) × m − 1] × ICC",k:["cvc"]},
{t:"Between-cluster coefficient of variation",aka:"k",d:"The standard deviation of the true cluster-level values divided by their mean. It is an alternative to the ICC {r:HayesBennett}.",k:["kcv"]},
{t:"Non-response",d:"Failure of a selected person to take part or to provide data {r:Porta}."},
{t:"Loss to follow-up",aka:"Dropout, attrition",d:"Participants who leave a study before outcome assessment. The sample is increased so that enough remain for analysis. Inflating the number does not remove any bias that the losses may cause {r:Friedman,CONSORT25}.",f:"Adjusted n = n / (1 − L)",k:["adj_L","LL"]},
{t:"Non-compliance",aka:"Drop-out and drop-in, crossover between arms",d:"Participants who do not receive or adhere to their assigned intervention, or who receive the other one. It dilutes the observed difference between groups {r:Friedman}.",f:"Adjusted n = n / (1 − c₁ − c₂)²",k:["adj_c1","adj_c2","c1","c2"]},
{t:"Allocation ratio",aka:"r",d:"The number in one group relative to the other. Equal allocation is the most efficient for a given total when variances are equal {r:Rosner,Hulley}.",f:"r = n₂ / n₁",k:["r","pia","Eshare","cn","ratio","Neq"]},
{t:"Rounding up",d:"Sample sizes are rounded up to the next whole unit. Samplewize rounds up after each adjustment step, so a result can differ by one from a hand calculation {r:Samplewize}."}
]},
{g:"Study designs",a:[
{t:"Cross-sectional study",d:"A study that measures exposures and outcomes at one point in time, in a defined population. It estimates prevalence {r:Grimes,Hulley}."},
{t:"Cohort study",d:"A study that follows exposed and unexposed people over time and compares how often the outcome occurs {r:Grimes,Hulley}."},
{t:"Case-control study",d:"A study that compares past exposure between people who have the outcome (cases) and people who do not (controls) {r:Grimes,Schlesselman}."},
{t:"Matching",aka:"Matched design, φ",d:"Choosing comparison participants who are similar on selected factors. In a matched case-control study, φ is the correlation of exposure within a pair {r:Dupont}.",k:["phi"]},
{t:"Randomised controlled trial",aka:"RCT",d:"A study in which participants are assigned by chance to an intervention or a comparator {r:Grimes,Friedman}."},
{t:"Superiority trial",d:"A trial designed to show that one intervention is better than another {r:ICHE9,Friedman}."},
{t:"Non-inferiority trial",d:"A trial designed to show that a new intervention is not worse than a comparator by more than a pre-specified margin {r:Piaggio,FDA16}."},
{t:"Non-inferiority margin",aka:"M, equivalence margin",d:"The largest loss of effect, or difference, that is considered acceptable. It should be justified on clinical and statistical grounds {r:EMA05,FDA16}.",k:["NM","MP"]},
{t:"Superiority by a margin",d:"A trial designed to show that the new intervention is better than the comparator by more than a stated margin {r:Chow}.",k:["NMs"]},
{t:"Equivalence trial",d:"A trial designed to show that two interventions differ by less than a pre-specified margin in either direction. It is commonly tested by two one-sided tests {r:Piaggio,Chow}."},
{t:"Crossover trial",aka:"σw",d:"A trial in which each participant receives the interventions in sequence, and so acts as their own control. The within-participant SD measures variation between periods in the same person {r:Julious04,Chow}.",k:["sdw"]},
{t:"Washout and carry-over",d:"Carry-over is an effect of an earlier treatment that continues into a later period. A washout is a treatment-free interval intended to prevent it {r:Chow,Friedman}."},
{t:"Before-after study",aka:"Paired design",d:"A design in which each participant is measured before and after an intervention, and the analysis uses the differences within each pair {r:Rosner,Chow}.",k:["sdd"]},
{t:"Single-arm study",d:"A study of one group, whose result is compared with a fixed reference value {r:Chow}."},
{t:"Multi-arm study",d:"A study comparing three or more groups {r:Cohen88,Chow}.",k:["kA"]},
{t:"Subgroup interaction",d:"A difference in the effect of an intervention between subgroups. A study needs a much larger sample to detect an interaction than to detect the main effect {r:Brookes}.",k:["nI"]},
{t:"Cluster randomised trial",d:"A trial in which groups, such as villages or clinics, are randomised instead of individuals {r:Donner81,HayesMoulton}."},
{t:"Stepped-wedge cluster trial",d:"A trial in which clusters cross from control to intervention at staggered, randomised times, until all have received the intervention {r:Hussey,Hemming}.",k:["ksw","tsw","bsw","nsw","Nrct"]},
{t:"Pilot study",d:"A small study carried out to prepare for a main study, such as by estimating the SD. It is not designed to test the main hypothesis. An SD from a small pilot is uncertain, so an upper confidence limit is often used {r:Lancaster,Browne,Kieser}.",k:["sp","mp"]},
{t:"Feasibility study",d:"A study of whether a main study can be done, covering matters such as recruitment, retention and acceptability {r:Lancaster}."},
{t:"Resource equation",aka:"Mead's E",d:"A method for animal experiments when an effect size cannot be estimated. E is the error degrees of freedom, and a value from 10 to 20 is considered adequate {r:Mead,CharanKantharia,Arifin}.",f:"E = total animals − total groups",k:["rdes","kgr","rrep","sac"]}
]},
{g:"Statistical methods used in the formulas",a:[
{t:"Z test and t test",d:"Tests comparing a statistic with its standard error. The t test is used for means when the SD is estimated from the data {r:Rosner}."},
{t:"Chi-square test",d:"A test comparing observed counts with those expected under the null hypothesis {r:Rosner,Fleiss}.",k:["chi"]},
{t:"Continuity correction",d:"An adjustment made because a continuous distribution is being used to approximate discrete counts. It gives a larger sample size {r:Fleiss,Casagrande}."},
{t:"Arcsine transformation",d:"A transformation of a proportion that stabilises its variance, used in Cohen's effect size h {r:Cohen88}.",f:"h = 2 arcsin√p₁ − 2 arcsin√p₂"},
{t:"McNemar's test and discordant pairs",aka:"p₁₀, p₀₁",d:"McNemar's test compares paired proportions. Discordant pairs are those in which the two members differ in outcome, and only these inform the test {r:Connor,Rosner}.",k:["p10","p01"]},
{t:"Analysis of variance",aka:"ANOVA",d:"A test of whether the means of several groups differ {r:Cohen88,Rosner}."},
{t:"Analysis of covariance",aka:"ANCOVA",d:"Comparison of follow-up means after adjusting for the baseline value. The stronger the correlation with baseline, the smaller the sample needed {r:Borm,Frison}."},
{t:"Correlation between repeated measures",aka:"ρ",d:"The correlation between measurements made on the same person at different times {r:Frison,Diggle}.",k:["rho"]},
{t:"Repeated measures",d:"Several measurements of the same outcome in each participant over time {r:Frison,Diggle}.",k:["nbase","nfu"]},
{t:"Mann-Whitney test",aka:"Wilcoxon rank-sum test",d:"A rank-based test comparing two independent groups, without assuming a normal distribution {r:Noether,Hodges}."},
{t:"Proportional odds model",aka:"Ordinal outcome, marginal proportion",d:"A model for ordered categories that assumes one common odds ratio across all cut-points. Marginal proportions are the expected shares in each category, across both groups combined {r:WhiteheadJ}.",k:["ORo","w1","w2","w3","w4","w5","w6","w7"]},
{t:"Poisson and negative binomial models",aka:"Dispersion, k",d:"Models for counts of events. A Poisson model assumes that the variance equals the mean. A negative binomial model allows extra variation through the dispersion k, and k = 0 returns the Poisson model {r:Zhu}.",f:"Variance = μ + k × μ²",k:["kd"]},
{t:"Linear regression",d:"A model relating a continuous outcome to one or more predictors {r:Green,Cohen88}.",k:["u","extra","gm","gtype"]},
{t:"Multiple correlation",aka:"R, variance inflation",d:"The correlation of a covariate with the other covariates in the model. It reduces the information available for that covariate, so the sample is inflated by 1 / (1 − R²) {r:Hsieh98,HsiehLavori}.",k:["Rc"]},
{t:"Logistic regression",d:"A model relating a binary outcome to one or more predictors, with effects expressed as odds ratios {r:Hsieh98,Bujang18}.",k:["P1h","P2h","B","Ph"]},
{t:"Events per variable",aka:"EPV",d:"The number of participants with the less frequent outcome, divided by the number of predictor parameters. The rule of 10 is widely used, but its basis has been questioned {r:Peduzzi,Vittinghoff,vanSmeden}.",k:["epv","kv","Pev","iv"]}
]},
{g:"Time-to-event analysis",a:[
{t:"Time-to-event outcome",aka:"Survival outcome",d:"The time from a defined starting point until an event occurs {r:AltmanTE}."},
{t:"Censoring",d:"Incomplete observation of the time to an event, for example when a participant has not had the event by the end of follow-up {r:AltmanTE}."},
{t:"Survival probability",aka:"S(t)",d:"The probability of remaining free of the event beyond time t {r:AltmanTE,Freedman}.",k:["S0","t0"]},
{t:"Hazard",aka:"h(t)",d:"The instantaneous rate at which events occur among those still at risk {r:Spruance}."},
{t:"Proportional hazards",d:"The assumption that the hazard ratio stays constant over time {r:Schoenfeld,Spruance}."},
{t:"Logrank test",d:"A test comparing survival curves across the whole period of follow-up {r:Freedman,Friedman}."},
{t:"Cox regression",aka:"Proportional hazards regression",d:"A regression model for time-to-event outcomes, with effects expressed as hazard ratios {r:HsiehLavori,Schoenfeld}."},
{t:"Number of events",d:"Power in survival analysis depends on the number of events, not on the number of participants. Enough participants must be followed for long enough to produce those events {r:Schoenfeld,Freedman}."},
{t:"Accrual period and follow-up",aka:"A, F",d:"The accrual period is the time over which participants are enrolled. Additional follow-up is the further time after enrolment ends {r:LachinFoulkes}.",k:["Acc","FU"]}
]},
{g:"Prediction models",a:[
{t:"Clinical prediction model",d:"A model that estimates an individual's risk of having or developing an outcome, using several predictors together {r:Riley20}."},
{t:"Candidate predictor parameters",aka:"P",d:"The number of model coefficients considered before any selection. A categorical predictor can use more than one parameter {r:Riley19,Riley20}.",k:["rP"]},
{t:"Overfitting and optimism",aka:"δ",d:"Overfitting occurs when a model describes the development data better than new data. Optimism is the amount by which apparent performance overstates true performance {r:Riley19,Riley20}.",k:["dropt"]},
{t:"Shrinkage factor",aka:"S",d:"A multiplier that pulls predictor effects towards zero to correct overfitting. A target of 0.9 or above is commonly recommended {r:Riley19,Riley20}.",k:["Ssh"]},
{t:"Cox-Snell R²",d:"A measure of overall model fit based on the likelihood, used to set the sample size for prediction models {r:Riley19,Riley20}.",k:["R2cs"]},
{t:"Margin for overall risk",d:"The acceptable error in estimating the overall outcome risk or mean, commonly set at 0.05 {r:Riley20}.",k:["mrisk"]}
]},
{g:"Diagnostic accuracy",a:[
{t:"Reference standard",aka:"Gold standard",d:"The best available method for establishing whether the target condition is present {r:STARD}."},
{t:"Sensitivity",aka:"Se",d:"The proportion of people with the condition whom the test correctly identifies as positive {r:AltmanDT1}.",f:"Se = TP / (TP + FN)",k:["Se"]},
{t:"Specificity",aka:"Sp",d:"The proportion of people without the condition whom the test correctly identifies as negative {r:AltmanDT1}.",f:"Sp = TN / (TN + FP)",k:["Sp"]},
{t:"Predictive values",aka:"PPV, NPV",d:"The proportion of positive results that are truly positive (PPV), and of negative results that are truly negative (NPV). Unlike sensitivity and specificity, they depend directly on prevalence {r:AltmanDT2}.",f:"PPV = TP / (TP + FP); NPV = TN / (TN + FN)"},
{t:"ROC curve",aka:"Receiver operating characteristic curve",d:"A plot of sensitivity against 1 − specificity across all possible test cut-offs {r:HanleyMcNeil}."},
{t:"Area under the ROC curve",aka:"AUC",d:"A summary of discrimination: the probability that a randomly chosen person with the condition scores higher than a randomly chosen person without it. A value of 0.5 means no discrimination, and 1 means perfect discrimination {r:HanleyMcNeil,Obuchowski}.",k:["A","A1","A0"]}
]},
{g:"Agreement and reliability",a:[
{t:"Cohen's kappa",aka:"κ",d:"Agreement between two raters beyond what is expected by chance. Kappa depends on how common the category is {r:SimWright}.",f:"κ = (pₒ − pₑ) / (1 − pₑ)",k:["k0","k1","kP","pik"]},
{t:"Intraclass correlation",aka:"ICC, reliability coefficient",d:"The proportion of total variance that is due to true differences between subjects. It is used for the reliability of continuous measurements {r:Walter,BonettICC}.",k:["r0","r1","rI","kr","krI"]},
{t:"Limits of agreement",aka:"Bland-Altman analysis",d:"The range within which about 95% of the differences between two measurement methods are expected to lie {r:BlandAltman}.",f:"Mean difference ± 1.96 × SD of the differences",k:["sBA","dBA"]},
{t:"Cronbach's alpha",aka:"α, coefficient alpha",d:"A measure of the internal consistency of a scale, based on the number of items and how strongly they relate to one another {r:BlandCA,BonettAlpha}.",f:"α = [k / (k − 1)] × [1 − Σsᵢ² / s²ₜ]",k:["a0","a1","aL","aU","items","nplan"]},
{t:"Factor analysis",d:"A method that examines whether items in a scale group together to reflect underlying constructs. The sample needed depends on how strongly items relate to the factors {r:MacCallum,Mokkink}."}
]},
{g:"Safety and rare events",a:[
{t:"Rule of three",d:"If no events occur among n participants, the upper limit of the 95% confidence interval for the event rate is approximately 3/n {r:HanleyLH}.",f:"Upper 95% limit ≈ 3 / n",k:["pev","Cp"]}
]},
{g:"Power and sensitivity analysis",a:[
{t:"A priori sample size calculation",d:"Calculating the sample size before a study begins, from the planned significance level, power and effect {r:Hoenig,ICHE9}."},
{t:"Reverse power calculation",aka:"Achieved power for a fixed sample",d:"Calculating the power available from a given number of participants, using planning values for the effect {r:Cohen88,Samplewize}.",k:["nfix","n1fix"]},
{t:"Minimum detectable effect",aka:"MDE",d:"The smallest effect that a study with a given sample size, significance level and power can be expected to detect {r:Cohen88,Hoenig}."},
{t:"Sensitivity analysis",d:"Repeating a calculation with different assumptions, to show how much the result depends on them {r:DELTA2,ICHE9}."},
{t:"Power curve",d:"A graph showing how power changes with sample size for a stated effect {r:Cohen88}."},
{t:"Post hoc power",aka:"Observed power",d:"Power calculated from the effect observed in a completed study. It is determined by the p-value and adds no further information, so it should not be used to interpret a result {r:Hoenig}."}
]},
{g:"Qualitative research",a:[
{t:"Purposeful sampling",aka:"Purposive sampling",d:"Selecting people or cases that are especially informative about the question under study {r:Palinkas}."},
{t:"Theoretical sampling",d:"Choosing further participants on the basis of concepts emerging from analysis, as used in grounded theory {r:Saunders}."},
{t:"Data saturation",d:"The point at which further data add little that is new to the analysis. It should be defined and reported, not merely claimed {r:Saunders,Vasileiou}."},
{t:"Code saturation",d:"The point at which the range of issues has been identified, and further data add few new codes {r:HenninkCode}."},
{t:"Meaning saturation",d:"The point at which the issues are understood in depth, including their nuance and context {r:HenninkCode}."},
{t:"Theoretical saturation",d:"The point at which categories have been fully developed through theoretical sampling {r:Saunders}."},
{t:"Information power",d:"The principle that the more relevant information a sample holds, the fewer participants are needed. It depends on study aim, sample specificity, use of theory, quality of dialogue and analysis strategy {r:Malterud}."},
{t:"Stopping criterion",d:"A rule set in advance for ending data collection, such as a stated number of further interviews with no new themes {r:Francis,GuestSat}."},
{t:"Focus group",d:"A guided discussion among a small group, used to explore views and how they develop through interaction {r:Krueger,GuestFG}."},
{t:"Reflexive thematic analysis",d:"An interpretive approach to developing themes. Its authors do not recommend saturation as a way of determining sample size {r:Braun}."}
]}

   const N=sNum("#st-pop"),n=sNum("#st-n"),e=sCheckCount(N,n);if(e)return sErr(e);
   if(id==="random"){const L=sRandomList(N,n,seed);return sResult(`<h2>${n} selected from ${N}</h2><pre class="ready slist" tabindex="0">${L.join(", ")}</pre>`,`A list of ${n} distinct random numbers between 1 and ${N} was generated using Samplewize (seed ${seed}).`,"Samplewize_random_list.csv","selected_number\n"+L.join("\n")+"\n");}
   const s=sSystematic(N,n,seed),k=X.round(s.k,4),st=X.round(s.start,4);
   return sResult(`<h2>Interval ${k}, start ${st}</h2><pre class="ready slist" tabindex="0">${s.picks.join(", ")}</pre>`,`Systematic random sampling was used, with a sampling interval of ${k} and a random start of ${st}, to select ${n} units from ${N} (Samplewize, seed ${seed}).`,"Samplewize_systematic_list.csv","selected_number\n"+s.picks.join("\n")+"\n");
  }
  const mode=id==="allocate"?$("#st-mode").value:"",P=sParseRows($("#st-rows").value,mode==="neyman"?2:1);
  if(P.bad.length)return sErr("Check line "+P.bad.join(", ")+(mode==="neyman"?". Each line needs a name, population size and standard deviation.":". Each line needs a name and a population size."));
  if(P.rows.length<(id==="allocate"?2:1))return sErr(id==="allocate"?"Enter at least two strata.":"Enter the clusters.");
  if(id==="allocate"){
   const n=sNum("#st-n"),rows=P.rows.map(r=>({name:r.name,N:r.v[0],sd:r.v[1]})),tot=rows.reduce((a,x)=>a+x.N,0);
   if(!Number.isInteger(n)||n<1)return sErr("Enter the sample size as a whole number.");if(n>tot)return sErr("The sample cannot be larger than the total population.");
   const A=sAllocate(rows,n,mode),neyman=mode==="neyman",small=A.filter(x=>x.n<2).length;
   return sResult(`<div class="tw"><table class="grid"><thead><tr><th>Stratum</th><th>Population</th><th>Sample</th><th>Fraction</th><th>Weight</th></tr></thead><tbody>${A.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.N}</td><td>${x.n}</td><td>${(x.frac*100).toFixed(1)}%</td><td>${x.weight===null?"-":X.round(x.weight,2)}</td></tr>`).join("")}<tr><th scope="row">Total</th><td>${tot}</td><td>${n}</td><td>${(n/tot*100).toFixed(1)}%</td><td></td></tr></tbody></table></div>${small?`<p class="flag warn">${small===1?"One stratum has":small+" strata have"} fewer than 2 selected units, so its variance cannot be estimated.</p>`:""}${neyman?`<p class="flag warn">Sampling fractions differ between strata, so use the weights in the overall analysis.</p>`:""}`,`The sample of ${n} was allocated across ${A.length} strata by ${neyman?"Neyman (optimum)":"proportionate"} allocation: ${A.map(x=>x.name+" "+x.n).join(", ")}.`,"Samplewize_stratum_allocation.csv","stratum,population,sample,fraction,weight\n"+A.map(x=>[sCsv(x.name),x.N,x.n,x.frac,x.weight===null?"":x.weight].join(",")).join("\n")+"\n");
  }
  const c=sNum("#st-c"),mv=$("#st-m").value.trim()===""?0:sNum("#st-m"),list=P.rows.map(r=>({name:r.name,size:r.v[0]}));
  if(!Number.isInteger(c)||c<1)return sErr("Enter the number of clusters as a whole number.");if(!Number.isInteger(mv)||mv<0)return sErr("Enter the number per cluster as a whole number.");if(c>list.length)return sErr("You cannot select more clusters than are listed.");
  const R=sPPS(list,c,mv,seed),I=X.round(R.I,2),S0=X.round(R.start,2);
  return sResult(`<h2>${c} selections from ${list.length} clusters</h2><p>Total population ${R.total}. Interval ${I}. Random start ${S0}.</p><div class="tw"><table class="grid"><thead><tr><th>Cluster</th><th>Population</th><th>Cumulative</th><th>Times selected</th></tr></thead><tbody>${R.chosen.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.size}</td><td>${x.cum}</td><td>${x.hits}</td></tr>`).join("")}</tbody></table></div>${R.multi?`<p class="flag warn">${R.multi===1?"One cluster was":R.multi+" clusters were"} selected more than once because of large population size. Take the number per cluster once for each selection.</p>`:""}${R.prob!==null?`<p>Each person's overall chance of selection is about ${X.round(R.prob*100,3)}%, and the sampling weight is about ${X.round(1/R.prob,1)}.</p>`:""}`,`${c} clusters were selected with probability proportional to size from ${list.length} clusters (total population ${R.total}), using a sampling interval of ${I} and a random start of ${S0} (Samplewize, seed ${seed}).`,"Samplewize_pps_selection.csv","cluster,population,cumulative,times_selected\n"+R.chosen.map(x=>[sCsv(x.name),x.size,x.cum,x.hits].join(",")).join("\n")+"\n");
 });
}
function drawRefs(){
 const list=Object.values(REFS).slice().sort((a,b)=>a.localeCompare(b));
 $("#pane").innerHTML=`<div class="pane-in"><div class="head"><h1>References</h1><p>All ${list.length} sources, including the app itself, listed alphabetically in Vancouver style. Each calculator numbers its own references in citation order.</p></div><div class="page"><section class="card"><h2>How to cite Samplewize</h2><p id="cite-app">${esc(REFS.Samplewize)}</p><button class="btn" id="copyc" type="button">Copy citation</button></section><input class="search" id="q-r" type="search" placeholder="Search references" aria-label="Search references"><ul class="refs plainrefs" id="rl">${list.map(r=>`<li data-x="${esc(r.toLowerCase())}">${esc(r)}</li>`).join("")}</ul></div></div>`;
 addCredit();
 $("#copyc").addEventListener("click",()=>copyFrom("#cite-app","#copyc","Copy citation"));
 $("#q-r").addEventListener("input",e=>{const t=e.target.value.trim().toLowerCase();document.querySelectorAll("#rl li").forEach(l=>{l.hidden=!!t&&!l.dataset.x.includes(t);});});
}
function route(){
 const rawH=(location.hash||"").slice(1);
 if(/^SW1-/.test(rawH)){const e=openCode(rawH);if(e){location.replace("#guide");}return;}
 const h=(location.hash||"#designs").slice(1).toLowerCase();
 const sh=ALL[h];const tab=sh?(h[0]==="d"?"designs":"formulas"):(["designs","formulas","sampling","guide","definitions","references","about"].includes(h)?h:(/^s-/.test(h)&&SAMP_BY[h.slice(2)])||(/^st-/.test(h)&&SAMP_TOOLS.some(t=>t.id===h.slice(3)))?"sampling":"designs");
 document.querySelectorAll("[data-t]").forEach(a=>a.classList.toggle("on",a.dataset.t===tab));
 const page=tab==="sampling"||tab==="guide"||tab==="definitions"||tab==="references"||tab==="about";
 document.body.className=page?"page-view":(sh?"calc":"list");
 $("#back").href="#"+tab;
 if(page){stopMini();tab==="sampling"?(/^s-/.test(h)?drawSampMethod(SAMP_BY[h.slice(2)]):/^st-/.test(h)?drawSampTool(h.slice(3)):drawSampling()):tab==="guide"?drawGuidePage():tab==="about"?drawAbout():tab==="definitions"?drawDefs():drawRefs();window.scrollTo(0,0);return;}
 drawSide(tab);
 const wide=window.matchMedia("(min-width:861px)").matches;
 const show=sh||(wide?(tab==="designs"?DESIGNS[0]:FORMULAS[0]):null);
 document.querySelectorAll("#side .row").forEach(r=>r.classList.toggle("on",!!show&&r.dataset.c===show.code.toLowerCase()));
 if(show){show.guide?drawGuide(show):drawCalc(show);if(show.guide)$("#mini").hidden=true;else $("#mini").hidden=false;}
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
$("#mini").addEventListener("click",()=>{const r=$("#result");if(r)r.scrollIntoView({behavior:"smooth",block:"center"});});
route();

</script>
