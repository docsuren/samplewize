<script>
/* Numerical core: same functions, argument order and rounding as the Excel workbooks. */
const X=(()=>{
const LG=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
function lgam(x){if(x<0.5)return Math.log(Math.PI/Math.abs(Math.sin(Math.PI*x)))-lgam(1-x);x-=1;let a=LG[0];const t=x+7.5;for(let i=1;i<9;i++)a+=LG[i]/(x+i);return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a);}
function bad(){throw new Error("domain");}
function gammaP(a,x){if(x<=0)return 0;if(x<a+1){let s=1/a,t=s,n=a;for(let i=0;i<100000;i++){n+=1;t*=x/n;s+=t;if(Math.abs(t)<Math.abs(s)*1e-16)break;}return s*Math.exp(-x+a*Math.log(x)-lgam(a));}return 1-gammaQcf(a,x);}

/* Suggestions, working from whatever is already known. An unanswered question shows the best option for each possible answer. */
function gSuggest(a){

 const miss=gQuestions(a).find(q=>a[q.id]===undefined&&!q.soft);
 if(!miss)return{items:gPlan(fill(a)).map(x=>({c:x[0],r:x[1],why:x[2]})),missing:null};
 const seen=new Set(),items=[];
 for(const[v,l]of miss.opts){const p=gPlan(fill(Object.assign({},a,{[miss.id]:v})))[0];if(!p)continue;const k=p[0]+"/"+p[1];if(seen.has(k))continue;seen.add(k);items.push({c:p[0],r:p[1],why:p[2],cond:l});if(items.length===4)break;}
 return{items,missing:miss.id};
}

 <details><summary>How to use Samplewize</summary><div class="dbody"><ol class="refs" style="padding-left:1.4em"><li>State the primary objective, then identify the design and outcome.</li><li>Open the matching study design or formula and choose the analysis option.</li><li>Enter planning values taken from similar studies, routine data or a pilot.</li><li>Enter expected losses and other adjustments.</li><li>Read any checks shown beside the result.</li><li>Copy the formula and the write-up, or create the protocol section, then add the source of each planning value.</li></ol></div></details>
 <details><summary>How results are calculated</summary><div class="dbody"><p>Z values are exact standard normal quantiles, so hand calculations using 1.96 and 0.84 can differ, usually by one participant. Base results are rounded up.</p><p>Adjustments are applied in this order, rounding up after each step: finite population correction (from the unrounded base result), design effect, non-compliance, then non-response or attrition.</p><p>The target difference should be important and realistic. Do not change it merely to fit the available resources. Take the standard deviation or event rate from similar studies and use “Try other values” to test plausible alternatives.</p></div></details>
 <details><summary>Your data and the limits of this app</summary><div class="dbody"><p>Calculations run on your device. Values you enter are not sent anywhere and are cleared when the app closes.</p><p>This app supports planning and does not replace review by a statistician. It does not suggest a target difference, margin or planning value. The Guide matches recognised terms and can misread a description. The checks are prompts and do not alter any result. Group-sequential designs, kappa with three or more categories, exact 1:M matching and cohort stepped-wedge designs need specialist methods.</p><p>The calculations reproduced 1,038 results from the validated companion Excel workbooks. Confirm journal details against the original records before citing a reference in a submission.</p></div></details>
 <details><summary>Sources for the Guide</summary><div class="dbody"><ol class="refs">${gr.map(k=>`<li>${esc(REFS[k])}</li>`).join("")}</ol></div></details>
 </div></div>`;
 addCredit();
 const ta=$("#g-text");ta.value=GUIDE.text;
 const go=()=>{GUIDE.text=ta.value.trim();GUIDE.ans=gRead(GUIDE.text);GUIDE.read=!!GUIDE.text;GUIDE.open={};gRender();const o=$("#g-out");if(o&&GUIDE.text)o.scrollIntoView({behavior:"smooth",block:"start"});};
 $("#g-go").addEventListener("click",go);
 $("#g-clear").addEventListener("click",()=>{ta.value="";GUIDE.text="";GUIDE.ans={};GUIDE.read=false;GUIDE.open={};gRender();});
 document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ta.value=c.textContent;go();}));
 ta.addEventListener("input",()=>{GUIDE.text=ta.value.trim();});
 $("#g-out").addEventListener("click",e=>{
  const ch=e.target.closest("[data-ch]");if(ch){GUIDE.open[ch.dataset.ch]=true;gRender();return;}
  const p=e.target.closest(".pill");
  if(p){const q=p.dataset.q,v=p.dataset.v,a=GUIDE.ans;delete GUIDE.open[q];if(q==="aim"){if(a.aim!==v)GUIDE.ans={aim:v};}else{a[q]=v;if(q==="design"||q==="ttype")delete a.outcome;}gRender();return;}
  const g=e.target.closest("[data-go]");if(g){const sh=ALL[g.dataset.go.toLowerCase()];if(sh&&sh.routes.length){st(sh).route=+g.dataset.r;}}
 });
 $("#g-open").addEventListener("click",()=>{$("#g-msg").textContent=openCode($("#g-code").value);});
 gRender();
}
function drawAbout(){
 const row=(k,v)=>`<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`;
 $("#pane").innerHTML=`<div class="pane-in"><div class="page"><div class="hero">${HERO.replace(/id="([^"]+)"/g,'id="ab-$1"').replace(/url\(#([^)]+)\)/g,'url(#ab-$1)').replace(/href="#([^"]+)"/g,'href="#ab-$1"')}<p class="appname">Samplewize</p><div class="tag">${TAGTXT}</div></div>
 <section class="card"><h2>About the app</h2><p>Samplewize is an evidence-based sample size calculator for medical research. It covers ${DESIGNS.length} study designs and ${FORMULAS.length} formulas, each with its published sources, an adjusted formula, a ready write-up and a protocol section.</p></section>
 <section class="card"><h2>App information</h2><table class="grid info"><tbody>${row("Version","1.0")}${row("Released","November 2026")}${row("Available as","Web app and Android app")}${row("Internet","Not needed for calculations")}</tbody></table></section>
 <section class="card"><h2>Creator</h2><p><strong>Dr Surendran Venkataraman</strong><br>MBBS, MD, DNB (Community Medicine)<br>Assistant Professor (Senior Scale)<br>Department of Community Medicine<br>Indira Gandhi Medical College and Research Institute, Puducherry, India</p></section>
 <section class="card"><h2>How to cite</h2><p id="ab-cite">${esc(REFS.Samplewize)}</p><button class="btn" id="ab-copy" type="button">Copy citation</button></section>
 <section class="card"><h2>Accuracy</h2><p>The calculations reproduced 1,038 results from the validated companion Excel workbooks. Formulas come from the published sources cited on each screen. <a href="#references">View all references</a>.</p></section>
 <section class="card"><h2>Privacy</h2><p>Calculations run on your device. Values and study descriptions you enter are not sent anywhere. The app needs no account and shows no advertisements, and the Android app requests no device permissions.</p></section>
 <section class="card"><h2>Important notice</h2><p>Samplewize supports research planning. It does not replace review by a statistician or an ethics committee, and it does not suggest a target difference, margin or planning value. Users are responsible for the inputs they enter and for how they use the results.</p></section>
 <section class="card"><h2>Third-party components</h2><p>QR codes: qrcode-generator by Kazuhiko Arase, MIT licence. Fonts: IBM Plex Sans, Noto Sans Tamil and STIX Two, SIL Open Font License.</p></section>
 <section class="card"><h2>Copyright</h2><p>${COPYR} Published formulas remain the work of their cited authors.</p></section>
 </div></div>`;
 addCredit();
 $("#ab-copy").addEventListener("click",()=>copyFrom("#ab-cite","#ab-copy","Copy citation"));
}
function drawRefs(){
 const list=Object.values(REFS).slice().sort((a,b)=>a.localeCompare(b));
 $("#pane").innerHTML=`<div class="pane-in"><div class="head"><h1>References</h1><p>All ${list.length} sources, including the app itself, listed alphabetically in Vancouver style. Each calculator numbers its own references in citation order.</p></div><div class="page"><section class="card"><h2>How to cite Samplewize</h2><p id="cite-app">${esc(REFS.Samplewize)}</p><button class="btn" id="copyc" type="button">Copy citation</button></section><input class="search" id="q-r" type="search" placeholder="Search references" aria-label="Search references"><ul class="refs plainrefs" id="rl">${list.map(r=>`<li data-x="${esc(r.toLowerCase())}">${esc(r)}</li>`).join("")}</ul></div></div>`;
 addCredit();
 $("#copyc").addEventListener("click",()=>copyFrom("#cite-app","#copyc","Copy citation"));
 $("#q-r").addEventListener("input",e=>{const t=e.target.value.trim().toLowerCase();document.querySelectorAll("#rl li").forEach(l=>{l.hidden=!!t&&!l.dataset.x.includes(t);});});
}
function route(){
 const rawH=(location.hash||"").slice(1);
 if(/^SW1-/.test(rawH)){const e=openCode(rawH);if(e){location.replace("#guide");}return;}
 const h=(location.hash||"#designs").slice(1).toLowerCase();
 const sh=ALL[h];const tab=sh?(h[0]==="d"?"designs":"formulas"):(["designs","formulas","guide","references","about"].includes(h)?h:"designs");
 document.querySelectorAll("[data-t]").forEach(a=>a.classList.toggle("on",a.dataset.t===tab));
 const page=tab==="guide"||tab==="references"||tab==="about";
 document.body.className=page?"page-view":(sh?"calc":"list");
 $("#back").href="#"+tab;
 if(page){stopMini();tab==="guide"?drawGuidePage():tab==="about"?drawAbout():drawRefs();window.scrollTo(0,0);return;}
 drawSide(tab);
 const wide=window.matchMedia("(min-width:861px)").matches;
 const show=sh||(wide?(tab==="designs"?DESIGNS[0]:FORMULAS[0]):null);
 document.querySelectorAll("#side .row").forEach(r=>r.classList.toggle("on",!!show&&r.dataset.c===show.code.toLowerCase()));
 if(show){show.guide?drawGuide(show):drawCalc(show);if(show.guide)$("#mini").hidden=true;else $("#mini").hidden=false;}
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
$("#mini").addEventListener("click",()=>{const r=$("#result");if(r)r.scrollIntoView({behavior:"smooth",block:"center"});});
route();

</script>
